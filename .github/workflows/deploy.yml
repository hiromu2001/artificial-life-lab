name: 遊べる完成版をGitHub Pagesへ自動公開

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Node.js設定
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 依存関係をインストール
        run: npm install

      - name: Reactアプリをビルド
        run: npm run build

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
