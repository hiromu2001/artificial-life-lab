name: 遊べる完成版を自動公開

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4
      - name: Node.js設定
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依存関係をインストール
        run: npm install
      - name: Reactアプリをビルド
        run: npm run build
      - name: 公開用ブランチへ配置
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
